services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: risk_user
      POSTGRES_PASSWORD: risk_password
      POSTGRES_DB: risk_db
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - risk_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U risk_user -d risk_db"]
      interval: 5s
      retries: 10
volumes:
  risk_pgdata:
